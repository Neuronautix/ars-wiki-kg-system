id: https://example.org/ars/kg_layer/knowledge_model
name: knowledge_model
description: Minimal pilot schema for ARS-derived structured knowledge objects.
prefixes:
  linkml: https://w3id.org/linkml/
  km: https://example.org/ars/kg/
default_prefix: km
default_range: string

enums:
  ContractVersion:
    permissible_values:
      "1.1":

  ReviewStatus:
    permissible_values:
      pending:
      in_review:
      accepted:
      rejected:
      needs_revision:

  ExtractionMethod:
    permissible_values:
      ars_hitl:
      markdown_heuristic:
      regex_citation_sentence:
      sentence_as_evidence_proxy:
      title_case_phrase_heuristic:
      file_ingestion:

  ClaimPolarity:
    permissible_values:
      supports:
      contradicts:
      neutral:
      uncertain:

  ClaimModality:
    permissible_values:
      asserted:
      observed:
      inferred:
      hypothetical:
      negated:

  RelationType:
    permissible_values:
      supports:
      contradicts:
      relates_to_concept:
      derived_from:
      cites:
      same_as:

slots:
  id:
    identifier: true
    required: true
  source_document:
    required: true
  source_section:
    required: true
  supporting_quote_or_span:
    required: true
  confidence:
    range: float
    required: true
  extraction_method:
    required: true
    range: ExtractionMethod
  review_status:
    required: true
    range: ReviewStatus
  reviewer_notes:
    required: false
  # Provenance fields populated during review (optional on extraction, required after review).
  reviewer:
    required: false
    description: Identity of the reviewer who approved or updated this item.
  reviewed_at:
    required: false
    description: ISO 8601 timestamp of the review decision.
  # Article-level metadata propagated from ARS HITL handoff files.
  article_id:
    required: false
    description: Unique identifier for the parent article or ARS run.
  run_id:
    required: false
    description: ARS run identifier for cross-run traceability.
  related_evidence_ids:
    range: string
    multivalued: true
    required: false
    description: Optional Evidence object ids linked to this item.
  related_concept_ids:
    range: string
    multivalued: true
    required: false
    description: Optional Concept object ids linked to this item.
  source_citation:
    required: false
    description: Citation string for the source used to support this item.
  canonical_label:
    required: false
    description: Preferred human-readable label, especially for Concept items.
  aliases:
    range: string
    multivalued: true
    required: false
    description: Alternative labels or synonyms for this item.
  iri:
    required: false
    description: Optional explicit stable IRI to use in semantic web exports.
  source_span_start:
    range: integer
    required: false
    description: Optional inclusive character offset where the extracted span starts.
  source_span_end:
    range: integer
    required: false
    description: Optional exclusive character offset where the extracted span ends.
  citation_ids:
    range: string
    multivalued: true
    required: false
    description: Structured citation identifiers (e.g., DOI, URL, PMID) linked to this item.
  claim_polarity:
    range: ClaimPolarity
    required: false
    description: Whether the claim supports, contradicts, or is neutral/uncertain regarding its target.
  claim_modality:
    range: ClaimModality
    required: false
    description: Assertion modality to separate observed facts from inferred or hypothetical statements.
  relation_edges:
    range: RelationEdge
    multivalued: true
    required: false
    description: Typed relation edge objects linking this node to another KG node with optional edge confidence.
  relation_target_id:
    range: string
    required: true
    description: Target object identifier for this relation edge.
  relation_type:
    range: RelationType
    required: true
    description: Relation type between source and target objects.
  relation_confidence:
    range: float
    required: false
    description: Optional confidence score for this relation edge in [0,1].
  canonical_id:
    required: false
    description: Stable canonical identifier for concept/entity normalization across runs.
  ontology_mappings:
    range: string
    multivalued: true
    required: false
    description: External ontology IDs/IRIs aligned to this item (e.g., Wikidata, MeSH, GO).
  contract_version:
    range: ContractVersion
    required: false
    description: KG contract version used to produce this object.

classes:
  RelationEdge:
    slots:
      - relation_target_id
      - relation_type
      - relation_confidence

  BaseExtractedObject:
    slots:
      - id
      - source_document
      - source_section
      - supporting_quote_or_span
      - confidence
      - extraction_method
      - review_status
      - reviewer_notes
      - reviewer
      - reviewed_at
      - article_id
      - run_id
      - related_evidence_ids
      - related_concept_ids
      - source_citation
      - canonical_label
      - aliases
      - iri
      - source_span_start
      - source_span_end
      - citation_ids
      - claim_polarity
      - claim_modality
      - relation_edges
      - canonical_id
      - ontology_mappings
      - contract_version

  Paper:
    is_a: BaseExtractedObject

  Concept:
    is_a: BaseExtractedObject

  Claim:
    is_a: BaseExtractedObject

  Evidence:
    is_a: BaseExtractedObject
