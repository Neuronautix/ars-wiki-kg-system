id: https://example.org/ars/kg_layer/knowledge_model
name: knowledge_model
description: Minimal pilot schema for ARS-derived structured knowledge objects.
prefixes:
  linkml: https://w3id.org/linkml/
  km: https://example.org/ars/kg/
default_prefix: km
default_range: string

enums:
  ReviewStatus:
    permissible_values:
      pending:
      in_review:
      accepted:
      rejected:
      needs_revision:

  ExtractionMethod:
    permissible_values:
      ars_hitl:
      markdown_heuristic:
      regex_citation_sentence:
      sentence_as_evidence_proxy:
      title_case_phrase_heuristic:
      file_ingestion:

slots:
  id:
    identifier: true
    required: true
  source_document:
    required: true
  source_section:
    required: true
  supporting_quote_or_span:
    required: true
  confidence:
    range: float
    required: true
  extraction_method:
    required: true
    range: ExtractionMethod
  review_status:
    required: true
    range: ReviewStatus
  reviewer_notes:
    required: false
  # Provenance fields populated during review (optional on extraction, required after review).
  reviewer:
    required: false
    description: Identity of the reviewer who approved or updated this item.
  reviewed_at:
    required: false
    description: ISO 8601 timestamp of the review decision.
  # Article-level metadata propagated from ARS HITL handoff files.
  article_id:
    required: false
    description: Unique identifier for the parent article or ARS run.
  run_id:
    required: false
    description: ARS run identifier for cross-run traceability.

classes:
  BaseExtractedObject:
    slots:
      - id
      - source_document
      - source_section
      - supporting_quote_or_span
      - confidence
      - extraction_method
      - review_status
      - reviewer_notes
      - reviewer
      - reviewed_at
      - article_id
      - run_id

  Paper:
    is_a: BaseExtractedObject

  Concept:
    is_a: BaseExtractedObject

  Claim:
    is_a: BaseExtractedObject

  Evidence:
    is_a: BaseExtractedObject
