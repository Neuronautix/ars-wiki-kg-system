name: Validate KG Contract and Artifacts

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop
      - "feature/**"
      - "copilot/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        check:
          - handoff
          - semantics
          - pipeline
          - artifacts
          - ars-contract
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate handoff contract
        if: matrix.check == 'handoff'
        run: |
          python3 kg_layer/validation/validate_ars_handoff.py kg_layer/data/examples

      - name: Validate semantic rules
        if: matrix.check == 'semantics'
        run: |
          python3 kg_layer/validation/validate_semantics.py kg_layer/data/examples

      - name: Run full pipeline
        if: matrix.check == 'pipeline'
        run: |
          python3 kg_layer/pipeline/run_pipeline.py \
            --structured-input-dir kg_layer/data/examples \
            --data-root /tmp/kg_ci_data

      - name: Verify produced artifacts
        if: matrix.check == 'artifacts'
        run: |
          python3 kg_layer/pipeline/run_pipeline.py \
            --structured-input-dir kg_layer/data/examples \
            --data-root /tmp/kg_ci_data
          test -f /tmp/kg_ci_data/published/graph.jsonld
          test -f /tmp/kg_ci_data/published/graph.accepted.jsonld
          test -f /tmp/kg_ci_data/published/graph.draft.jsonld
          test -f /tmp/kg_ci_data/published/quality/run_quality_report.json
          test -f /tmp/kg_ci_data/published/quality/quality_trends.json
          test -f /tmp/kg_ci_data/published/constraints/accepted/constraint_manifest.json
          test -f /tmp/kg_ci_data/published/constraints/draft/constraint_manifest.json
          python3 -m json.tool /tmp/kg_ci_data/published/graph.jsonld > /dev/null
          python3 -m json.tool /tmp/kg_ci_data/published/graph.accepted.jsonld > /dev/null
          python3 -m json.tool /tmp/kg_ci_data/published/graph.draft.jsonld > /dev/null

      - name: Validate ARS v1 handoff compatibility
        if: matrix.check == 'ars-contract'
        run: |
          mkdir -p /tmp/ars_kg_handoff
          cp vendor/academic-research-skills/tests/fixtures/kg_contract/good_kg_handoff.json \
            /tmp/ars_kg_handoff/article-123.kg_candidates.json
          python3 vendor/academic-research-skills/scripts/check_kg_handoff.py \
            /tmp/ars_kg_handoff/article-123.kg_candidates.json
          python3 vendor/academic-research-skills/scripts/check_claim_verification_report.py \
            vendor/academic-research-skills/tests/fixtures/kg_contract/good_claim_verification_report.json
          python3 kg_layer/pipeline/run_pipeline.py \
            --structured-input-dir /tmp/ars_kg_handoff \
            --data-root /tmp/ars_kg_ci_data \
            --skip-review-apply
